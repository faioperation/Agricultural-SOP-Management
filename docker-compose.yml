services:
  nginx:
    image: nginx:1.25-alpine
    container_name: sop-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sop-frontend
    restart: always
    networks:
      - sop-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sop-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:FarmSOP_Db_p9x82m4q1@postgres:5432/sop_management
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=default
      - REDIS_PASSWORD=FarmSOP_Redis_k82w90z1
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sop-network

  postgres:
    image: postgres:16-alpine
    container_name: sop-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: FarmSOP_Db_p9x82m4q1
      POSTGRES_DB: sop_management
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sop-network

  redis:
    image: redis:7-alpine
    container_name: sop-redis
    restart: always
    command: redis-server --requirepass FarmSOP_Redis_k82w90z1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "FarmSOP_Redis_k82w90z1", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sop-network

volumes:
  pgdata:
  redisdata:

networks:
  sop-network:
    driver: bridge
